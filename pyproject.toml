[build-system] 
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transport_frames" 
version = "2.0.5"
authors = [
    {name = "Alexander Morozov", email = "alexandermorozzov@gmail.com" },
    {name = "Polina Krupenina", email = "krupenina.p@mail.ru" }
] 
description = "Python library for transport indicator analysis based on travel-time matrices."
readme = "README.rst"
requires-python = ">=3.10"
license = { file = "LICENCE" }

dependencies = [
    "geopandas>=0.12,<0.15",
    "osmnx==1.9.4",
    "networkx>=3.2",
    "contextily==1.6.2",
    "folium==0.14.0",
    "momepy==0.9.1",
    "mapclassify==2.6.1",
    "pyogrio==0.10.0",
    "pandas>=2.1",
    "pyarrow==19.0.0",
    "pandera==0.22.1",
    "iduedu==0.2.2"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[tool.setuptools.packages.find]
include = ["transport_frames*"]


[project.optional-dependencies]
dev = [
    "black[jupyter]==22.3",
    "mapclassify==2.6.1",     
    "folium==0.14.0",       
    "matplotlib-inline==0.1.6",
    "ipykernel",
    "jupyter",
    "ipywidgets",
    "isort==5.10.1",
    "pylint==2.17.5",
    "pre-commit>=3.1",
    "build",
    "twine",
]

test = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
]

docs = [
    "docutils>=0.18.1,<0.20",
    "sphinx==6.2.1",
    "sphinx-book-theme==1.0.1",
    "nbsphinx==0.9.3",
    "nbsphinx-link==1.3.0",
    "numpydoc==1.5.0",
    "autodocsumm==0.2.12",
    "myst_parser>=3.0.0,<4.0.0",
    "sphinx_rtd_theme>=1.2.0,<2.0.0",
    "pandoc>=2.0.0,<3.0.0",
    "readme_renderer<44.0",
]


[project.urls]
"Repository" = "https://github.com/alexandermorozzov/tf"
"Bug Tracker" = "https://github.com/alexandermorozzov/tf/issues"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.pylint.format]
max-line-length = 120
expected-line-ending-format = "LF"

[tool.pylint.main]
extension-pkg-allow-list = ["pydantic"]

[tool.pycodestyle]
max-line-length = 120


[tool.isort]
lines_after_imports = 2
multi_line_output = 3
line_length = 120
include_trailing_comma = true
